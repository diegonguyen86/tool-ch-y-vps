name: Hunt Oracle ARM Instance

on:
  schedule:
    - cron: '0 * * * *' # Backup kích hoạt mỗi tiếng 1 lần nếu lỡ bị ngắt
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  apply-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Hunt Loop 50 Minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          send_tele() {
            local msg="$1"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${msg}" > /dev/null
          }

          send_tele "🚀 [Oracle Hunt] Đợt săn mới bắt đầu (chạy liên tục 50 phút, 60s/lần)..."

          START_TIME=$(date +%s)
          # Chạy vòng lặp trong vòng 50 phút (3000 giây)
          while [ $(( $(date +%s) - START_TIME )) -lt 3000 ]; do
            echo "--- [$(date '+%H:%M:%S')] Gửi yêu cầu tạo máy ---"
            
            JOB_ID=$(oci resource-manager job create-apply-job \
              --stack-id "${{ secrets.STACK_ID }}" \
              --execution-plan-strategy AUTO_APPROVED \
              --query 'data.id' --raw-output 2>/dev/null || true)

            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
              echo "Đã gửi Job: $JOB_ID. Kiểm tra trạng thái..."
              
              # Chờ job chạy xong tối đa 3 phút
              for i in {1..9}; do
                sleep 20
                STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || true)
                echo "Trạng thái: $STATUS"
                
                if [ "$STATUS" = "SUCCEEDED" ]; then
                  send_tele "🎉🎉 TẠO VPS THÀNH CÔNG! Đã săn được ARM Singapore 4 Core / 24GB RAM. Đang tắt bot săn!"
                  gh workflow disable apply.yml || true
                  exit 0
                elif [ "$STATUS" = "FAILED" ]; then
                  break
                fi
              done
            fi

            echo "Chưa có slot, nghỉ 60s trước khi thử tiếp..."
            sleep 60
          done

          # Sau 50 phút, tự kích hoạt lại lượt tiếp theo
          send_tele "🔄 [Oracle Hunt] Kết thúc phiên 50 phút (vẫn chưa có slot). Đang khởi động lại phiên mới..."
          gh workflow run apply.yml || true
