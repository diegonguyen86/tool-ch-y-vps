name: Hunt Oracle ARM Instance

on:
  schedule:
    # Tự động chạy mỗi 15 phút
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  apply-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Apply Stack & Report to Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          send_tele() {
            local msg="$1"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}&text=${msg}&parse_mode=HTML" > /dev/null
          }

          echo "Gửi yêu cầu Apply Stack..."
          JOB_RAW=$(oci resource-manager job create-apply-job \
            --stack-id "${{ secrets.STACK_ID }}" \
            --execution-plan-strategy AUTO_APPROVED 2>&1 || true)

          JOB_ID=$(echo "$JOB_RAW" | jq -r '.data.id // empty' 2>/dev/null || true)

          if [ -z "$JOB_ID" ]; then
            echo "Lỗi gửi lệnh hoặc trùng Job: $JOB_RAW"
            send_tele "⚠️ <b>[Oracle Hunt] Gặp sự cố khi gửi Job!</b>%0ANội dung: Job trước chưa chạy xong hoặc lỗi xác thực API."
            exit 0
          fi

          echo "Đã tạo Job: $JOB_ID. Đang chờ kết quả..."

          # Kiểm tra trạng thái Job (tối đa 5 phút)
          for i in {1..15}; do
            sleep 20
            STATUS=$(oci resource-manager job get --job-id "$JOB_ID" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || true)
            echo "Lần $i: Trạng thái = $STATUS"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              send_tele "🎉🎉🎉 <b>[Oracle Hunt] TẠO VPS THÀNH CÔNG!</b>%0AĐã săn được slot ARM Singapore (4 Core / 24GB RAM).%0AWorkflow đã tự động TẮT để tránh tạo thừa."
              gh workflow disable apply.yml || true
              exit 0
            elif [ "$STATUS" = "FAILED" ]; then
              send_tele "⏳ <b>[Oracle Hunt] Kết quả lần chạy:</b>%0AVẫn hết tài nguyên (Out of capacity). Đang chờ 15 phút sau thử lại..."
              exit 0
            fi
          done

          send_tele "⏱️ <b>[Oracle Hunt] Cảnh báo:</b> Job $JOB_ID chạy quá 5 phút chưa kết thúc. Sẽ kiểm tra lại ở lượt tiếp theo."

      - name: Notify on System Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🚨 <b>[Oracle Hunt] LỖI WORKFLOW!</b>%0AQuá trình chạy trên GitHub Actions gặp sự cố bất thường (lỗi cài CLI hoặc lỗi mạng).&parse_mode=HTML" > /dev/null
